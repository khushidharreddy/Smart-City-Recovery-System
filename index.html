<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart City Recovery System</title>

  <link rel="stylesheet" href="style.css">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <div class="container">

    <!-- HEADER -->
    <header>
      <h1>SMART CITY CENTRAL CONSOLE</h1>
      <h2>Station Ordering & Disorder Analysis</h2>

      <div class="status">
        SYSTEM STATUS :
        <span>CORRUPTED</span>
      </div>
    </header>


    <!-- STATION INPUT -->
    <section class="stations-section">

      <h3>Input Stations</h3>

      <div class="station-container" id="stationContainer">
      </div>

    </section>


    <!-- BUTTONS -->
    <section class="button-section">

      <button onclick="convertValues()">
        Convert ASCII Values
      </button>

      <button onclick="sortStations()">
        Sort Stations
      </button>

      <button onclick="countInversions()">
        Count Inversions
      </button>

      <button onclick="resetSystem()">
        Reset
      </button>

    </section>


    <!-- ASCII TABLE -->
    <section class="table-section">

      <h3>ASCII Conversion Table</h3>

      <table>
        <thead>
          <tr>
            <th>Station</th>
            <th>ASCII Value</th>
          </tr>
        </thead>

        <tbody id="tableBody">
        </tbody>
      </table>

    </section>


    <!-- SORTED OUTPUT -->
    <section class="output-section">

      <h3>Recovered Signal Order</h3>

      <div class="sorted-output" id="sortedOutput">
        Waiting for recovery...
      </div>

    </section>


    <!-- INVERSION COUNT -->
    <section class="inversion-section">

      <h3>Total Disorder Detected</h3>

      <div class="inversion-box">
        Inversion Count :
        <span id="inversionCount">0</span>
      </div>

    </section>


  </div>

  <script src="script.js"></script>

</body>
</html>
